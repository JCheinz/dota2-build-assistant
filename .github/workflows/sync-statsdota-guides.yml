name: Sync StatsDota hero skill guides
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/sync-statsdota-guides.js'
      - 'scripts/statsdota-guide-sync.js'
      - '.github/workflows/sync-statsdota-guides.yml'
jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download and parse current hero guides
        run: node scripts/sync-statsdota-guides.js
      - name: Commit updated snapshot when changed
        run: |
          if git diff --quiet -- statsdota-guides.json; then
            echo "StatsDota snapshot is already current."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add statsdota-guides.json
            git commit -m "Refresh StatsDota hero skill guide snapshot"
            git push
          fi
