name: STRATZ Pugna validation
on:
  workflow_dispatch:
    inputs:
      position:
        description: "Posición que se validará en una ejecución individual"
        required: true
        type: choice
        default: POSITION_1
        options:
          - POSITION_1
          - POSITION_2
          - POSITION_3
          - POSITION_4
          - POSITION_5
concurrency:
  group: stratz-api-access
  cancel-in-progress: false
jobs:
  pugna:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/statsdota-skill-guide-snapshot
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check STRATZ integration syntax and query planner
        run: |
          node --check scripts/stratz-api-client.js
          node --check scripts/inspect-stratz-schema.js
          node --check scripts/stratz-query-plan.js
          node --check scripts/probe-stratz-pugna.js
          node tests/stratz-query-plan.test.js
      - name: Inspect live STRATZ GraphQL schema
        env:
          STRATZ_API_TOKEN: ${{ secrets.STRATZ_API_TOKEN }}
        run: npm run stratz:inspect
      - name: Validate Pugna data for one selected position
        env:
          STRATZ_API_TOKEN: ${{ secrets.STRATZ_API_TOKEN }}
        run: node scripts/probe-stratz-pugna.js --position=${{ inputs.position }}
      - name: Preserve schema and Pugna evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stratz-pugna-${{ inputs.position }}
          path: data/
          if-no-files-found: warn
          retention-days: 14
