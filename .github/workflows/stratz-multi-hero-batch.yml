name: STRATZ complete hero and position audit
on:
  workflow_dispatch:
    inputs:
      audit_mode:
        description: "Auditoría completa o una sola posición"
        required: true
        type: choice
        default: all_positions
        options:
          - all_positions
          - one_position
      position:
        description: "Solo se utiliza cuando eliges one_position"
        required: true
        type: choice
        default: POSITION_1
        options:
          - POSITION_1
          - POSITION_2
          - POSITION_3
          - POSITION_4
          - POSITION_5
      start:
        description: "Índice inicial (solo una posición; empieza en 0)"
        required: true
        default: "0"
        type: string
      limit:
        description: "Cantidad de héroes (solo una posición; máximo 127)"
        required: true
        default: "3"
        type: string
concurrency:
  group: stratz-api-access
  cancel-in-progress: false
jobs:
  audit:
    runs-on: self-hosted
    timeout-minutes: 360
    defaults:
      run:
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/statsdota-skill-guide-snapshot
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate auditor and offline tests
        run: |
          node --check scripts/stratz-api-client.js
          node --check scripts/stratz-query-plan.js
          node --check scripts/stratz-normalize.js
          node --check scripts/stratz-evidence-quality.js
          node --check scripts/stratz-batch-audit.js
          node tests/stratz-query-plan.test.js
          node tests/stratz-normalize.test.js
          node tests/stratz-evidence-quality.test.js
          node tests/stratz-batch-audit.test.js
      - name: Inspect STRATZ schema
        env:
          STRATZ_API_TOKEN: ${{ secrets.STRATZ_API_TOKEN }}
        run: npm run stratz:inspect
      - name: Audit all five positions automatically
        if: inputs.audit_mode == 'all_positions'
        env:
          STRATZ_API_TOKEN: ${{ secrets.STRATZ_API_TOKEN }}
        run: |
          $positions = @("POSITION_1", "POSITION_2", "POSITION_3", "POSITION_4", "POSITION_5")
          foreach ($position in $positions) {
            Write-Host "=== Auditoría completa: $position ==="
            node scripts/stratz-batch-audit.js --position=$position --start=0 --limit=127
            if ($LASTEXITCODE -ne 0) {
              throw "La auditoría de $position tuvo errores. El progreso quedó guardado; se puede reanudar."
            }
          }
      - name: Audit one selected position
        if: inputs.audit_mode == 'one_position'
        env:
          STRATZ_API_TOKEN: ${{ secrets.STRATZ_API_TOKEN }}
        run: |
          node scripts/stratz-batch-audit.js --position=${{ inputs.position }} --start=${{ inputs.start }} --limit=${{ inputs.limit }}
      - name: Preserve all evidence and checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stratz-complete-audit-${{ github.run_number }}
          path: data/stratz-batch/
          if-no-files-found: warn
          retention-days: 30
