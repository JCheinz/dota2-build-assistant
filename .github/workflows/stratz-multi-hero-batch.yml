name: STRATZ multi-hero batch audit
on:
  workflow_dispatch:
    inputs:
      position:
        description: "Posición a auditar en este lote"
        required: true
        type: choice
        default: POSITION_1
        options:
          - POSITION_1
          - POSITION_2
          - POSITION_3
          - POSITION_4
          - POSITION_5
      start:
        description: "Índice inicial del catálogo (empieza en 0)"
        required: true
        default: "0"
        type: string
      limit:
        description: "Cantidad de héroes para este lote (prueba inicial: 3)"
        required: true
        default: "3"
        type: string
concurrency:
  group: stratz-api-access
  cancel-in-progress: false
jobs:
  audit:
    runs-on: self-hosted
    timeout-minutes: 90
    defaults:
      run:
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/statsdota-skill-guide-snapshot
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate batch auditor
        run: |
          node --check scripts/stratz-api-client.js
          node --check scripts/stratz-query-plan.js
          node --check scripts/stratz-normalize.js
          node --check scripts/stratz-batch-audit.js
          node tests/stratz-query-plan.test.js
          node tests/stratz-normalize.test.js
          node tests/stratz-evidence-quality.test.js
          node tests/stratz-batch-audit.test.js
      - name: Inspect STRATZ schema
        env:
          STRATZ_API_TOKEN: ${{ secrets.STRATZ_API_TOKEN }}
        run: npm run stratz:inspect
      - name: Audit selected hero batch
        env:
          STRATZ_API_TOKEN: ${{ secrets.STRATZ_API_TOKEN }}
        run: node scripts/stratz-batch-audit.js --position=${{ inputs.position }} --start=${{ inputs.start }} --limit=${{ inputs.limit }}
      - name: Preserve batch evidence and checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stratz-batch-${{ inputs.position }}-${{ inputs.start }}-${{ inputs.limit }}
          path: data/stratz-batch/
          if-no-files-found: warn
          retention-days: 30
