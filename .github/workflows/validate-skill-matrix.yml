name: Validate skill matrix
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check specializations syntax
        run: node --check specializations.js
      - name: Test dynamic matrix and Pugna regressions
        run: node tests/skill-matrix.test.js
      - name: Test inventory ledger lifecycle and regressions
        run: node tests/inventory-ledger.test.js
