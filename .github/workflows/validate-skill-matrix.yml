name: Validate skill matrix
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check application modules syntax
        run: |
          node --check specializations.js
          node --check inventory-ledger.js
          node --check item-icons.js
          node --check match-clock.js
          node --check scripts/statsdota-guide-sync.js
          node --check scripts/sync-statsdota-guides.js
          node --check scripts/stratz-query-plan.js
          node --check scripts/sync-d2pt-primary-guides.js
          node --check skill-data-engine.js
          node --check hero-library-engine.js
          node --check build-data-engine.js
          node --check patch-data-742.js
      - name: Audit real guide coverage, dynamic matrix and Pugna regressions
        run: node tests/skill-matrix.test.js
      - name: Test inventory ledger lifecycle and regressions
        run: |
          node tests/inventory-ledger.test.js
          node tests/item-icons.test.js
      - name: Test pausable match clock and phase boundaries
        run: node tests/match-clock.test.js
      - name: Test STRATZ query plan by position
        run: node tests/stratz-query-plan.test.js
      - name: Test hero dictionary library
        run: node tests/hero-library-engine.test.js
      - name: Test skill data extraction engine
        run: node tests/skill-data-engine.test.js
      - name: Test StatsDota guide parser
        run: node tests/statsdota-guide-sync.test.js
      - name: Test StatsDota rate-limit circuit breaker
        run: node tests/statsdota-sync-network.test.js
      - name: Test live build data engine
        run: node tests/build-data-engine.test.js
      - name: Test Dota 2 7.42 compatibility data
        run: node tests/patch-data-742.test.js
