name: Build Android APK

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK platform
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install web and Capacitor dependencies
        run: npm install --no-audit --no-fund

      - name: Validate application modules
        run: |
          node --check specializations.js
          node --check inventory-ledger.js
          node --check skill-data-engine.js
          node --check patch-data-742.js
          npm run check:android
          node tests/skill-matrix.test.js
          node tests/inventory-ledger.test.js
          node tests/skill-data-engine.test.js
          node tests/patch-data-742.test.js

      - name: Prepare local web bundle
        run: npm run build:web

      - name: Generate Android platform
        run: npx cap add android

      - name: Synchronize Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dota2-build-assistant-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
