name: Probe StatsDota hero guide feed
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/probe-statsdota-guides.js'
      - 'scripts/sync-statsdota-guides.js'
      - 'scripts/statsdota-guide-sync.js'
      - 'scripts/sync-d2pt-primary-guides.js'
      - 'build-data-engine.js'
      - '.github/workflows/probe-statsdota.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/probe-statsdota-guides.js'
      - 'scripts/sync-statsdota-guides.js'
      - 'scripts/statsdota-guide-sync.js'
      - '.github/workflows/probe-statsdota.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect public guide pages and skill order markup
        run: node scripts/probe-statsdota-guides.js
      - name: Audit all StatsDota hero guides
        run: node scripts/sync-statsdota-guides.js --output=statsdota-guides.json
      - name: Preserve complete audit snapshot and incomplete list
        uses: actions/upload-artifact@v4
        with:
          name: statsdota-hero-guide-audit
          path: statsdota-guides.json
          if-no-files-found: error
          retention-days: 14
      - name: Sync missing heroes from Dota2ProTracker primary positions
        run: node scripts/sync-d2pt-primary-guides.js --input=statsdota-guides.json --output=d2pt-primary-guides.json --delay-ms=3500 --retries=2
      - name: Preserve Dota2ProTracker primary-role guide audit
        uses: actions/upload-artifact@v4
        with:
          name: d2pt-primary-guides-audit
          path: d2pt-primary-guides.json
          if-no-files-found: error
          retention-days: 30
